[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "draftspring"
version = "0.1.0"
description = "Open-source AI content automation app for Ghost blogs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-ulid>=2.0.0",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
    "Pillow>=10.4.0",
    "structlog>=24.0.0",
    "stripe>=10.0.0",
    "aioboto3>=13.0.0",
    "python-multipart>=0.0.9",
    "markdown>=3.7",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "email-validator>=2.0.0",
    "anthropic>=0.39.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
